<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Mi sueldo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            
        </style>

        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <h1>Mi sueldo y mi reparto</h1>
            <section class="tarjeta">
                <h2>Mi sueldo</h2>
                <div>
                    <label for="frecuencia">Cada cuanto</label>
                    <select id="frecuencia">
                        <option value="semanal">Semanal</option>
                        <option value="cada2semanas">Cada dos semanas</option>
                        <option value="quincenal">Quincena</option>
                        <option value="mensual">Mensual</option>
                    </select>
                </div>
                <div>
                    <p>Escribiste: <strong id="eco"></strong></p>
                    <label for="monto">Monto de cada pago</label>
                    <input id="monto" type="number" min="0" step="0.01" placeholder="Por ejemplo 9300">
                </div>

                <ul>
                    <!-- CORREGIDO: faltaba la comilla de cierre del id y sobraba la "x" -->
                    <li>Semanal: <strong id="eq-semanal"></strong></li>
                    <li>Cada dos semanas: <strong id="eq-cada2semanas"></strong></li>
                    <li>Quincenal: <strong id="eq-quincenal"></strong></li>
                    <li>Mensual: <strong id="eq-mensual"></strong></li>
                    <li>Anual: <strong id="eq-anual"></strong></li>
                </ul>
            </section>
            <section class="tarjeta">
                <h2>Mi reparto</h2>
                <p>Mi dinero se dividira en las siguientes categorias</p>
                <ul>
                    <li>Gastos basicos</li>
                    <li>Ocio</li>
                    <li>Ahorro</li>
                    <li>Deudas</li>
                    <li>Inversiones</li>
                </ul>
            </section>
        </main>
        <script>

            const PAGOS_POR_ANIO = {
                semanal: 52,
                cada2semanas: 26,
                quincenal: 24,
                mensual: 12
            };

            const formatoMoneda = new Intl.NumberFormat("es-MX", {style: "currency", currency: "MXN"});

            const campoMonto = document.getElementById("monto");
            const eco = document.getElementById("eco");
            const campoFrecuencia = document.getElementById("frecuencia");

            function mostrarMonto(){
                eco.textContent = campoMonto.value;
            }

            function leerMonto(){
                const numero = Number(campoMonto.value);
                if (numero < 0 || Number.isNaN(numero)){
                    return 0;
                }
                return numero;
            }

            function calcularEquivalentes(frecuencia, monto) {
                const anual = monto * PAGOS_POR_ANIO[frecuencia];
                return{
                    semanal: anual/52,
                    cada2semanas: anual/26,
                    quincenal: anual/24,
                    mensual: anual/12,
                    anual: anual
                };
            }

            function mostrarEquivalentes(){
                const frecuencia = campoFrecuencia.value;
                const monto = leerMonto();
                const eq = calcularEquivalentes(frecuencia, monto);

                document.getElementById("eq-semanal").textContent = formatoMoneda.format(eq.semanal);
                document.getElementById("eq-cada2semanas").textContent = formatoMoneda.format(eq.cada2semanas);
                document.getElementById("eq-quincenal").textContent = formatoMoneda.format(eq.quincenal);
                document.getElementById("eq-mensual").textContent = formatoMoneda.format(eq.mensual);
                document.getElementById("eq-anual").textContent = formatoMoneda.format(eq.anual);
            }

            campoMonto.addEventListener("input", mostrarMonto);

            mostrarEquivalentes();
        </script>
    </body>
</html>
