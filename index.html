<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Mi sueldo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <h1>Mi sueldo y mi reparto</h1>
            <section class="tarjeta">
                <h2>Mi sueldo</h2>
                <div>
                    <label for="frecuencia">Cada cuanto</label>
                    <select id="frecuencia">
                        <option value="semanal">Semanal</option>
                        <option value="cada2semanas">Cada dos semanas</option>
                        <option value="quincenal">Quincena</option>
                        <option value="mensual" selected>Mensual</option>
                    </select>
                </div>
                <div>
                    <label for="monto">Monto de cada pago</label>
                    <input id="monto" type="number" min="0" step="0.01" placeholder="Por ejemplo 9300">
                </div>

                <ul>
                    <li>Semanal: <strong id="eq-semanal"></strong></li>
                    <li>Cada dos semanas: <strong id="eq-cada2semanas"></strong></li>
                    <li>Quincenal: <strong id="eq-quincenal"></strong></li>
                    <li>Mensual: <strong id="eq-mensual"></strong></li>
                    <li>Anual: <strong id="eq-anual"></strong></li>
                </ul>
            </section>
            <section class="tarjeta">
                <h2>Mi reparto</h2>
                <div class="tabla-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Categoria</th>
                                <th>%</th>
                                <th>Por semana</th>
                                <th>Por quincena</th>
                                <th>Por mes</th>
                            </tr>
                            <th></th>
                        </thead>
                        <tbody id="filas-reparto"></tbody>
                        <tfoot>
                            <tr>
                                <td>Total</td>
                                <td id="tot-pct"></td>
                                <td id="tot-semana"></td>
                                <td id="tot-quincena"></td>
                                <td id="tot-mes"></td>
                            </tr>
                            <td></td>
                        </tfoot>
                    </table>
                </div>
                <button id ="agregar-categoria" type="button">+ Agregar Categoria</button>
            </section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
